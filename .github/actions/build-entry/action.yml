name: '统一源码构建入口'
description: '复用六套源码入口工作流的公共初始化、源码与自定义配置准备流程（仅运行 shell 步骤）'
inputs:
  repo-branch:
    description: '入口工作流选择的源码分支，仅用于显示步骤名称'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: ⚠️ 上游更新提示（不阻断编译）
      if: github.repository != 'datout/Openwrt-Auto'
      shell: bash
      run: |
        set -euo pipefail
        UPSTREAM_REPO="datout/Openwrt-Auto"
        UPSTREAM_BRANCH="main"
        SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-}"

        write_unavailable_summary() {
          [[ -n "${SUMMARY_FILE}" ]] || return 0
          {
            echo "## ⚠️ 上游更新检查暂不可用（不阻断编译）"
            echo
            echo "> 无法获取 upstream 状态。本次编译仍继续使用 Fork 中的代码。"
          } >> "${SUMMARY_FILE}"
        }

        UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
        if git remote get-url upstream >/dev/null 2>&1; then
          if ! git remote set-url upstream "${UPSTREAM_URL}"; then
            echo "::warning title=⚠️ 上游更新检查暂不可用::无法配置 upstream 远程仓库。本次编译仍会继续。"
            write_unavailable_summary
            exit 0
          fi
        else
          if ! git remote add upstream "${UPSTREAM_URL}"; then
            echo "::warning title=⚠️ 上游更新检查暂不可用::无法添加 upstream 远程仓库。本次编译仍会继续。"
            write_unavailable_summary
            exit 0
          fi
        fi

        if ! git fetch upstream "${UPSTREAM_BRANCH}" --prune; then
          echo "::warning title=⚠️ 上游更新检查暂不可用::无法获取 ${UPSTREAM_REPO}/${UPSTREAM_BRANCH}。本次编译仍会继续。"
          write_unavailable_summary
          exit 0
        fi

        LOCAL_COMMIT="$(git rev-parse HEAD)"
        UPSTREAM_COMMIT="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
        AHEAD="$(git rev-list --count "${UPSTREAM_COMMIT}..${LOCAL_COMMIT}")"
        BEHIND="$(git rev-list --count "${LOCAL_COMMIT}..${UPSTREAM_COMMIT}")"

        if git merge-base --is-ancestor "${UPSTREAM_COMMIT}" "${LOCAL_COMMIT}"; then
          echo "::notice title=上游同步状态::当前提交已包含上游 main（ahead=${AHEAD}, behind=0）。"
          exit 0
        fi

        COMMON_BASE="$(git merge-base "${LOCAL_COMMIT}" "${UPSTREAM_COMMIT}" 2>/dev/null || true)"
        if [[ -z "${COMMON_BASE}" ]]; then
          echo "::warning title=⚠️ 上游有更新（不阻断编译）::当前 Fork 与 ${UPSTREAM_REPO}/${UPSTREAM_BRANCH} 没有共同 Git 历史。本次编译仍会继续。"
          if [[ -n "${SUMMARY_FILE}" ]]; then
            {
              echo "## ⚠️ 上游有更新（不阻断编译）"
              echo
              echo "> **当前 Fork 与官方 upstream 没有共同 Git 历史。** 本次编译仍会继续。"
              echo
              echo "建议：如果你希望重新跟随官方框架，请执行 **Sync upstream**。"
            } >> "${SUMMARY_FILE}"
          fi
          exit 0
        fi

        mapfile -t UPSTREAM_FILES < <(
          git diff --name-status --no-renames "${COMMON_BASE}" "${UPSTREAM_COMMIT}" |
            sed '/^$/d'
        )
        mapfile -t UPSTREAM_COMMITS < <(
          git log --format='%h %s' "${COMMON_BASE}..${UPSTREAM_COMMIT}" --max-count=50
        )

        echo "::warning title=⚠️ 上游有 ${BEHIND} 个新提交（不阻断编译）::当前 Fork 落后 upstream ${BEHIND} 个提交（ahead=${AHEAD}）。本次编译不会被阻止。"
        echo
        echo "============================================================"
        echo "⚠️  上游有新更新，但不会阻断本次编译"
        echo "============================================================"
        echo "当前 Fork：   ${LOCAL_COMMIT:0:12}"
        echo "官方 upstream：${UPSTREAM_COMMIT:0:12}"
        echo "领先提交：   ${AHEAD}"
        echo "落后提交：   ${BEHIND}"
        echo
        echo "📌 上游新增提交（最多 50 个）："
        if ((${#UPSTREAM_COMMITS[@]})); then
          printf '  %s\n' "${UPSTREAM_COMMITS[@]}"
        else
          echo "  （没有可显示的非 merge 提交）"
        fi
        echo
        echo "📂 上游变更文件（最多显示 100 个）："
        if ((${#UPSTREAM_FILES[@]})); then
          printf '  %s\n' "${UPSTREAM_FILES[@]:0:100}"
          if ((${#UPSTREAM_FILES[@]} > 100)); then
            echo "  ... 其余 $(( ${#UPSTREAM_FILES[@]} - 100 )) 个文件未展开"
          fi
        else
          echo "  （没有文件变更）"
        fi
        echo
        echo "👉 当前编译继续使用你 Fork 中的代码。"
        echo "👉 如需获得官方最新框架修复，请执行 Sync upstream。"
        echo "============================================================"

        if [[ -n "${SUMMARY_FILE}" ]]; then
          {
            echo "## ⚠️ 上游有 ${BEHIND} 个新提交（不阻断编译）"
            echo
            echo "> **不会阻止本次编译。** 当前编译继续使用 Fork 中的代码。"
            echo
            echo "| 项目 | 当前状态 |"
            echo "| --- | --- |"
            echo "| Fork | \\`${LOCAL_COMMIT:0:12}\\` |"
            echo "| upstream | \\`${UPSTREAM_COMMIT:0:12}\\` |"
            echo "| 领先 | ${AHEAD} 个提交 |"
            echo "| 落后 | **${BEHIND} 个提交** |"
            echo
            echo "### 📌 上游新增提交"
            if ((${#UPSTREAM_COMMITS[@]})); then
              echo '```text'
              printf '%s\n' "${UPSTREAM_COMMITS[@]}"
              echo '```'
            else
              echo "（没有可显示的非 merge 提交）"
            fi
            echo
            echo "### 📂 上游变更文件"
            if ((${#UPSTREAM_FILES[@]})); then
              echo '```text'
              printf '%s\n' "${UPSTREAM_FILES[@]:0:100}"
              if ((${#UPSTREAM_FILES[@]} > 100)); then
                echo "... 其余 $(( ${#UPSTREAM_FILES[@]} - 100 )) 个文件未展开"
              fi
              echo '```'
            else
              echo "（没有文件变更）"
            fi
            echo
            echo "### 下一步"
            echo "如果希望获得官方最新框架修复，请执行 **Sync upstream**。"
          } >> "${SUMMARY_FILE}"
        fi
    - name: 验证 REPO_TOKEN
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        if [[ -z "${{ env.REPO_TOKEN }}" ]]; then
           echo -e "\033[31m 您没有设置仓库密匙，请按教程设置好密匙再来 \033[0m\n"
           echo -e "\033[32m REPO_TOKEN密匙制作教程：https://git.io/jm.md \033[0m\n"
           exit 1
        fi
        [[ -d "mishi" ]] && rm -rf mishi
        git clone --depth=1 -b "${{ github.ref_name }}" https://user:${{ env.REPO_TOKEN }}@github.com/${{github.repository}}.git mishi
        if [ -z "$(ls -1 mishi)" ]; then
           echo -e "\033[31m 您的密匙错误或已过期，或制作的时候勾选不正确，请按教程设置好密匙再来 \033[0m\n"
           echo -e "\033[32m REPO_TOKEN密匙制作教程：https://git.io/jm.md \033[0m\n"
           exit 1
        fi
        [[ -d "mishi" ]] && rm -rf mishi
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
    - name: 解析启动方式与构建参数
      shell: bash
      run: |
        cd ${GITHUB_WORKSPACE}

        COMPILE_PATH="$GITHUB_WORKSPACE/build/${FOLDER_NAME}"

        load_settings_file() {
          local settings_file="$1"
          if [[ ! -f "${settings_file}" ]]; then
            echo "::error title=settings.ini 缺失::${settings_file}"
            return 1
          fi
          if ! bash -n "${settings_file}"; then
            echo "::error title=settings.ini 语法错误::${settings_file}"
            return 1
          fi
          # shellcheck disable=SC1090
          source "${settings_file}"
        }

        if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.event.head_commit }}" != "null" ]]; then
          #触发启动
           if [[ -f "${COMPILE_PATH}/relevance/settings.ini" ]]; then
              load_settings_file "${COMPILE_PATH}/relevance/settings.ini"
              echo "ERRUN_NUMBER=${ERRUN_NUMBER}" >> ${GITHUB_ENV}
           fi
        elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
           if [[ -n "${BUILD_CONTEXT:-}" ]]; then
              # 第二阶段 compile.yml 已通过 BUILD_CONTEXT 将完整运行参数装入 env。
              # 这里不再使用空的 github.event.inputs.REPO_BRANCH 等字段覆盖它们。
              SSH_ACTION="false"
              echo "检测到两阶段 BUILD_CONTEXT，使用第一阶段传递的构建参数。"
           else
              # 源码入口工作流由用户手动启动，继续兼容原有 inputs。
              if [[ -f "${COMPILE_PATH}/settings.ini" ]]; then
                 load_settings_file "${COMPILE_PATH}/settings.ini"
              else
                 echo "::error title=settings.ini 缺失::${COMPILE_PATH}/settings.ini"
                 exit 1
              fi
              REPO_BRANCH="${{ github.event.inputs.REPO_BRANCH }}"
              CONFIG_FILE="${{ github.event.inputs.CONFIG_FILE }}"
              INFORMATION_NOTICE="${{ github.event.inputs.INFORMATION_NOTICE }}"
              KEEP_WORKFLOWS="${{ github.event.inputs.KEEP_WORKFLOWS }}"
              KEEP_RELEASES="${{ github.event.inputs.KEEP_RELEASES }}"
              SSH_ACTION="${{ github.event.inputs.SSH_ACTION }}"
              UPLOAD_FIRMWARE="${{ github.event.inputs.UPLOAD_FIRMWARE }}"
              UPLOAD_RELEASE="${{ github.event.inputs.UPLOAD_RELEASE }}"
              CACHEWRTBUILD_SWITCH="${{ github.event.inputs.CACHEWRTBUILD_SWITCH }}"
              UPDATE_FIRMWARE_ONLINE="${{ github.event.inputs.UPDATE_FIRMWARE_ONLINE }}"
           fi
        else
           #其他启动
           if [[ -f "${COMPILE_PATH}/settings.ini" ]]; then
              load_settings_file "${COMPILE_PATH}/settings.ini"
           fi
        fi

        echo "SOURCE_CODE=${SOURCE_CODE}" >> ${GITHUB_ENV}
        echo "REPO_BRANCH=${REPO_BRANCH}" >> ${GITHUB_ENV}
        echo "INFORMATION_NOTICE=${INFORMATION_NOTICE}" >> ${GITHUB_ENV}
        echo "KEEP_WORKFLOWS=${KEEP_WORKFLOWS}" >> ${GITHUB_ENV}
        echo "KEEP_RELEASES=${KEEP_RELEASES}" >> ${GITHUB_ENV}
        echo "SSH_ACTION=${SSH_ACTION}" >> ${GITHUB_ENV}
        echo "UPLOAD_FIRMWARE=${UPLOAD_FIRMWARE}" >> ${GITHUB_ENV}
        echo "UPLOAD_RELEASE=${UPLOAD_RELEASE}" >> ${GITHUB_ENV}
        echo "CACHEWRTBUILD_SWITCH=${CACHEWRTBUILD_SWITCH}" >> ${GITHUB_ENV}
        echo "UPDATE_FIRMWARE_ONLINE=${UPDATE_FIRMWARE_ONLINE}" >> ${GITHUB_ENV}
        echo "GITHUB_LINK=https://github.com/${{github.repository}}" >> ${GITHUB_ENV}
        echo "GIT_ACTOR=${{github.actor}}" >> ${GITHUB_ENV}
        echo "WAREHOUSE_MAN=${GIT_REPOSITORY##*/}" >> ${GITHUB_ENV}
        echo "RUN_NUMBER=${{github.run_number}}" >> ${GITHUB_ENV}
        echo "GIT_REFNAME=${{ github.ref_name }}" >> ${GITHUB_ENV}
        echo "COMPILATION_INFORMATION=${COMPILATION_INFORMATION}" >> ${GITHUB_ENV}
        echo "CONFIG_FILE=${CONFIG_FILE}" >> ${GITHUB_ENV}

        echo "HOME_PATH=$GITHUB_WORKSPACE/openwrt" >> ${GITHUB_ENV}
        echo "COMPILE_PATH=${COMPILE_PATH}" >> ${GITHUB_ENV}
        echo "BUILD_DIY=${COMPILE_PATH}/diy" >> ${GITHUB_ENV}
        echo "BUILD_FILES=${COMPILE_PATH}/files" >> ${GITHUB_ENV}
        echo "BUILD_PATCHES=${COMPILE_PATH}/patches" >> ${GITHUB_ENV}
        echo "BUILD_PARTSH=${COMPILE_PATH}/diy-part.sh" >> ${GITHUB_ENV}
        echo "BUILD_SETTINGS=${COMPILE_PATH}/settings.ini" >> ${GITHUB_ENV}
        echo "MYCONFIG_FILE=${COMPILE_PATH}/seed/${CONFIG_FILE}" >> ${GITHUB_ENV}
    - name: 非 main 分支安全模式
      shell: bash
      run: |
        if [[ "${{ github.ref_name }}" != "main" ]]; then
          echo "SAFE_BRANCH_MODE=true" >> "${GITHUB_ENV}"
          echo "UPLOAD_RELEASE=false" >> "${GITHUB_ENV}"
          echo "UPDATE_FIRMWARE_ONLINE=false" >> "${GITHUB_ENV}"
          echo "::notice title=测试分支安全模式::当前分支 ${{ github.ref_name }}：已强制关闭 Release 发布和在线更新云端上传，不影响 main。"
        else
          echo "SAFE_BRANCH_MODE=false" >> "${GITHUB_ENV}"
        fi
    - name: 标准化缓存与通知参数
      shell: bash
      run: |
        cd ${GITHUB_WORKSPACE}
        # 关键：false 就关闭缓存（不清缓存）
        case "${{ env.CACHEWRTBUILD_SWITCH }}" in
          *"false"*)
            echo "CACHEWRTBUILD_SWITCH=false" >> "$GITHUB_ENV"
            ;;
          *)
            echo "CACHEWRTBUILD_SWITCH=true" >> "$GITHUB_ENV"
            ;;
        esac

        case "${{ env.INFORMATION_NOTICE }}" in
          *"tg"*|*"TG"*|*"telegram"*|*"Telegram"*)
            echo "INFORMATION_NOTICE=TG" >> "$GITHUB_ENV"
            ;;
          *"push"*|*"PUSH"*|*"pushplus"*|*"Pushplus"*)
            echo "INFORMATION_NOTICE=PUSH" >> "$GITHUB_ENV"
            ;;
          *)
            echo "INFORMATION_NOTICE=false" >> "$GITHUB_ENV"
            ;;
        esac
    - name: 初始化公共脚本
      shell: bash
      run: |
        cd ${GITHUB_WORKSPACE}
        # Use only the repository-local common scripts.
        LINSHI_COMMON="${GITHUB_WORKSPACE}/common"
        echo "LINSHI_COMMON=${LINSHI_COMMON}" >> ${GITHUB_ENV}
        echo "COMMON_SH=${LINSHI_COMMON}/common.sh" >> ${GITHUB_ENV}
        echo "UPGRADE_SH=${LINSHI_COMMON}/upgrade.sh" >> ${GITHUB_ENV}

        CONFIG_TXT="${LINSHI_COMMON}/config.txt"
        echo "CONFIG_TXT=${CONFIG_TXT}" >> ${GITHUB_ENV}

        if [ -f "${LINSHI_COMMON}/custom/first.sh" ] && grep -qE "bash" "${LINSHI_COMMON}/custom/first.sh"; then
           chmod -R +x "${LINSHI_COMMON}"
           if ! bash -n "${LINSHI_COMMON}/custom/first.sh"; then
             echo "::error title=common/custom/first.sh 语法错误::${LINSHI_COMMON}/custom/first.sh"
             exit 1
           fi
           # first.sh runs with the workflow's normal errexit behavior. The ERR trap
           # adds the failing file/line without weakening error handling.
           set -E
           trap 'first_rc=$?; echo "::error title=初始化公共脚本失败::${BASH_SOURCE[0]}:${BASH_LINENO[0]} 返回状态 ${first_rc}"' ERR
           source "${LINSHI_COMMON}/custom/first.sh"
           trap - ERR
           set +E
        else
           echo "缺少 common/custom/first.sh，请检查仓库文件"
           exit 1
        fi
    - name: 加载源码构建变量
      shell: bash
      run: |
        cd ${GITHUB_WORKSPACE}
        if [ -f "${COMMON_SH}" ] && grep -qE "bash" "${COMMON_SH}"; then
           chmod +x "${COMMON_SH}"
           bash $COMMON_SH Diy_menu6
        else
           echo "公共脚本初始化失败，请检查仓库文件"
           exit 1
        fi
    - name: 部署配置环境
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
        APT_LISTCHANGES_FRONTEND: none
      shell: bash
      run: |
        set -euo pipefail
        timeout 20m bash -s <<'SETUP_ENV'
        set -euo pipefail
        sudo -E apt-get -qq -o Acquire::Retries=3 update
        sudo -E apt-get -qq -o Acquire::Retries=3 install -y \
          gawk git gettext libssl-dev xsltproc zip wget curl grep \
          python2.7 python3 python3-pip libpython3-dev jq

        sudo ln -snf "/usr/share/zoneinfo/${TZ}" /etc/localtime
        echo "${TZ}" | sudo tee /etc/timezone >/dev/null

        WORK_ROOT="/${DIY_WORK:?DIY_WORK 未设置}"
        if [[ "${WORK_ROOT}" == "/" || "${WORK_ROOT}" == "//" ]]; then
          echo "::error::拒绝把仓库工作目录设置为系统根目录"
          exit 1
        fi
        sudo install -d -m 0755 -o "${USER}" -g "$(id -gn)" "${WORK_ROOT}"
        echo "配置工作目录已准备：${WORK_ROOT}"
        SETUP_ENV
    - name: 下载 ${{ env.FOLDER_NAME }}-${{ inputs['repo-branch'] }} 源码
      working-directory: /${{ env.DIY_WORK }}
      shell: bash
      run: |
        git clone -q -b "${REPO_BRANCH}" --single-branch "${REPO_URL}" openwrt
        ln -sfn "/${DIY_WORK}/openwrt" "${GITHUB_WORKSPACE}/openwrt"
        bash ${{ env.COMMON_SH }} Diy_feedsconf
        echo "SHANG_CHUAN=true" >> ${GITHUB_ENV}
    - name: 公告
      if: env.SendMessage != 'true'
      continue-on-error: true
      shell: bash
      run: |
        cd "$HOME_PATH"
        echo -e "\n\033[0;33m第一次用我仓库的，请不要拉取任何插件，先SSH进入固件配置那里看过我脚本实在是没有你要的插件才再拉取\033[0m"
        echo -e "\n\033[0;33m拉取插件应该单独拉取某一个你需要的插件，别一下子就拉取别人一个插件包，这样容易增加编译失败概率\033[0m"
        if [[ "${UPDATE_FIRMWARE_ONLINE}" == "true" ]]; then
           echo -e "\n\033[0;31mSSH连接固件输入命令'openwrt'可进行修改后台IP、清空密码、还原出厂设置和在线更新固件操作\033[0m"
        else
           echo -e "\n\033[0;31mSSH连接固件输入命令'openwrt'可进行修改后台IP，清空密码和还原出厂设置操作\033[0m"
        fi
        echo
    - name: 下载源码后进行源码微调和增加插件源
      shell: bash
      run: |
        cd "$HOME_PATH"
        bash "$COMMON_SH" Diy_menu
    - name: 运行自定义文件
      shell: bash
      run: |
        cd "$HOME_PATH"
        bash "$COMMON_SH" Diy_menu2
    - name: 检查并设置默认主题
      shell: bash
      run: |
        cd "$HOME_PATH"
        bash "$COMMON_SH" Diy_menu3
branding:
  icon: "terminal"
  color: "gray-dark"
