name: 项目自检

on:
  push:
    branches:
      - next
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Shell / YAML / Workflow / 两阶段交接检查
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Shell 语法检查
        shell: bash
        run: |
          set -euo pipefail
          files=(
            common/common.sh
            common/upgrade.sh
            common/custom/first.sh
            common/custom/assets.sh
            common/custom/ubuntu.sh
            common/custom/seed_finalize.sh
            common/custom/seed_refresh.sh
            common/custom/compile_firmware.sh
            common/custom/build_manifest.sh
            common/custom/build_diagnostics.sh
          )
          while IFS= read -r file; do
            files+=("${file}")
          done < <(find common/lib -maxdepth 1 -type f -name '*.sh' -print | sort)
          for file in "${files[@]}"; do
            if [[ -f "${file}" ]]; then
              echo "bash -n ${file}"
              bash -n "${file}"
            fi
          done

      - name: ShellCheck 严格检查
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -x -e SC2154 \
            common/lib/core.sh \
            common/lib/feeds.sh \
            common/lib/sources.sh \
            common/custom/compile_firmware.sh \
            common/custom/build_manifest.sh \
            common/custom/build_diagnostics.sh

      - name: ShellCheck 迁移模块观察
        shell: bash
        run: |
          set -euo pipefail
          # 原样迁出的历史模块：error 级问题阻断；warning/info/style 继续显示但不阻断。
          mapfile -t migrated_modules < <(
            find common/lib -maxdepth 1 -type f -name '*.sh' \
              ! -name 'core.sh' ! -name 'feeds.sh' ! -name 'sources.sh' \
              -print | sort
          )
          if (( ${#migrated_modules[@]} > 0 )); then
            shellcheck -x -e SC2154 -S error "${migrated_modules[@]}"
            shellcheck -x -e SC2154 -S warning "${migrated_modules[@]}" || true
          fi

      - name: YAML 语法检查
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path('.github').rglob('*.yml')) + sorted(Path('.github').rglob('*.yaml'))
          for path in files:
              with path.open('r', encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f'OK {path}')
          PY

      - name: Actionlint Workflow 检查（观察期）
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}"
          curl -fsSL --retry 3 --retry-delay 2 "${URL}" -o "/tmp/${ARCHIVE}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp actionlint
          /tmp/actionlint -color

      - name: 官方 Action Node24 兼容检查
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude=validate.yml 'actions/checkout@v4|actions/upload-artifact@v4' .github; then
            echo '发现仍使用 Node.js 20 的官方 Action 旧主版本'
            exit 1
          fi
          grep -RInE 'actions/checkout@v5|actions/upload-artifact@v7' .github >/dev/null

      - name: 两阶段交接安全检查
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'git[[:space:]]+push.*(--force|[[:space:]]-f([[:space:]]|$))' .github/actions/trigger/action.yml
          ! grep -nE "^[[:space:]]+-[[:space:]]*['\"]?build/.*/relevance/start" .github/workflows/compile.yml
          grep -q 'actions/workflows/compile.yml/dispatches' .github/actions/trigger/action.yml
          grep -q 'SEED_COMMIT' .github/workflows/compile.yml
          grep -q 'BUILD_CONTEXT' .github/workflows/compile.yml

      - name: beta2 编译诊断逻辑检查
        shell: bash
        run: |
          set -euo pipefail
          grep -q '单线程 V=s 获取真实失败包' common/custom/compile_firmware.sh
          grep -q 'xray_failed' common/custom/compile_firmware.sh
          ! grep -q 'Build failed, trying fallback (gvisor go1.26 fix)' .github/workflows/compile.yml
          grep -q 'build_diagnostics.sh' .github/workflows/compile.yml
          grep -q 'build_manifest.sh' .github/workflows/compile.yml
          grep -q 'actions/upload-artifact@v7' .github/workflows/compile.yml

      - name: beta3 common.sh 模块化边界检查
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'source "${COMMON_LIB_DIR}/core.sh"' common/common.sh
          grep -q 'source "${COMMON_LIB_DIR}/feeds.sh"' common/common.sh
          grep -q 'source "${COMMON_LIB_DIR}/sources.sh"' common/common.sh
          grep -q 'source "${COMMON_LIB_DIR}/git.sh"' common/common.sh
          grep -q 'source "${COMMON_LIB_DIR}/config.sh"' common/common.sh
          grep -q 'source "${COMMON_LIB_DIR}/firmware.sh"' common/common.sh
          grep -Rqx 'Diy_feed_postprocess' common/lib
          ! grep -q '^function TIME()' common/common.sh
          ! grep -q '^function variable()' common/common.sh
          ! grep -q '^function detect_upstream_luci_edition()' common/common.sh
          ! grep -q '^function Diy_COOLSNOWWOLF()' common/common.sh
          ! grep -q '^function Diy_OFFICIAL()' common/common.sh
          ! grep -q '^function Diy_partsh()' common/common.sh
          ! grep -q '^function Diy_scripts()' common/common.sh
          ! grep -q '^function Diy_profile()' common/common.sh
          ! grep -q '^function Diy_firmware()' common/common.sh
          ! grep -q '^function gitsvn()' common/common.sh

          tmp_env="$(mktemp)"
          BENDI_VERSION=0 GITHUB_ENV="${tmp_env}" bash -c '
            source common/common.sh
            declare -F TIME >/dev/null
            declare -F variable >/dev/null
            declare -F detect_upstream_luci_edition >/dev/null
            declare -F Diy_feed_postprocess >/dev/null
            declare -F Diy_COOLSNOWWOLF >/dev/null
            declare -F Diy_OFFICIAL >/dev/null
            declare -F Diy_partsh >/dev/null
            declare -F Diy_scripts >/dev/null
            declare -F Diy_profile >/dev/null
            declare -F Diy_firmware >/dev/null
            declare -F gitsvn >/dev/null
          '
          rm -f "${tmp_env}"

      - name: beta4 构建清单回归检查
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name.endswith(".tmp")' common/custom/build_manifest.sh
          grep -q -- '--show-toplevel' common/custom/build_manifest.sh
          grep -q 'KERNEL_PATCHVER' common/custom/build_manifest.sh
          grep -q 'GO_VERSION_MAJOR_MINOR' common/custom/build_manifest.sh
          grep -q 'openwrt_go_declared' common/custom/build_manifest.sh
          grep -q '"schema": 2' common/custom/build_manifest.sh
      - name: beta5 common.sh 启动阶段模块化检查
        shell: bash
        run: |
          set -euo pipefail
          for module in bootstrap checkout finalize; do
            test -s "common/lib/${module}.sh"
            grep -q "source \"\${COMMON_LIB_DIR}/${module}.sh\"" common/common.sh
          done
          for fn in Diy_variable Diy_feedsconf Diy_checkout Diy_management; do
            ! grep -q "^function ${fn}()" common/common.sh
            count="$(grep -Rh "^function ${fn}()" common/lib | wc -l | tr -d ' ')"
            [[ "${count}" == "1" ]]
          done
          grep -q '^function Diy_definition()' common/common.sh
          grep -q '^function Diy_prevent()' common/common.sh
          grep -q '^ACTIONS_VERSION="2.11.0"' common/common.sh

          tmp_env="$(mktemp)"
          BENDI_VERSION=0 GITHUB_ENV="${tmp_env}" bash -c '
            source common/common.sh
            for fn in Diy_variable Diy_feedsconf Diy_checkout Diy_management Diy_definition Diy_prevent Diy_menu Diy_menu5 Diy_menu6; do
              declare -F "${fn}" >/dev/null || exit 1
            done
          '
          rm -f "${tmp_env}"

      - name: Git 格式检查
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD 2>/dev/null || git diff --check
          test -s UPSTREAM_VERSION
