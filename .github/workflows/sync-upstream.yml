name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: datout/Openwrt-Auto
  UPSTREAM_BRANCH: main

jobs:
  sync:
    if: github.repository != 'datout/Openwrt-Auto'
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: 备份自定义文件
        shell: bash
        run: |
          set -e
          ts=$(date -u +%Y%m%d_%H%M%S)
          mkdir -p backups/auto_sync
          shopt -s nullglob
          tar -czf "backups/auto_sync/custom-backup-${ts}.tar.gz" \
            build/*/diy-part.sh \
            build/*/settings.ini \
            build/*/seed \
            build/*/relevance \
            2>/dev/null || true
          shopt -u nullglob
          echo "BACKUP_FILE=backups/auto_sync/custom-backup-${ts}.tar.gz" >> $GITHUB_ENV

      - name: 上传自定义文件备份
        uses: actions/upload-artifact@v7
        with:
          name: custom-backup
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: ignore

      - name: 合并上游到默认分支
        shell: bash
        run: |
          set -euxo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch upstream "${UPSTREAM_BRANCH}" --prune

          git checkout "${DEFAULT_BRANCH}"

          LOCAL_COMMIT="$(git rev-parse HEAD)"
          UPSTREAM_COMMIT="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

          # If upstream is already an ancestor, the fork is synchronized or ahead.
          if git merge-base --is-ancestor "${UPSTREAM_COMMIT}" "${LOCAL_COMMIT}"; then
            AHEAD="$(git rev-list --count "${UPSTREAM_COMMIT}..${LOCAL_COMMIT}")"
            echo "Already up to date with upstream (ahead=${AHEAD}, behind=0)."
            exit 0
          fi

          if git merge-base --is-ancestor "${LOCAL_COMMIT}" "${UPSTREAM_COMMIT}"; then
            BEHIND="$(git rev-list --count "${LOCAL_COMMIT}..${UPSTREAM_COMMIT}")"
            echo "Sync required: behind=${BEHIND}, ahead=0."
          else
            COMMON_BASE="$(git merge-base "${LOCAL_COMMIT}" "${UPSTREAM_COMMIT}" 2>/dev/null || true)"
            if [[ -n "${COMMON_BASE}" ]]; then
              AHEAD="$(git rev-list --count "${UPSTREAM_COMMIT}..${LOCAL_COMMIT}")"
              BEHIND="$(git rev-list --count "${LOCAL_COMMIT}..${UPSTREAM_COMMIT}")"
              echo "Syncing a diverged history (ahead=${AHEAD}, behind=${BEHIND}, common=${COMMON_BASE})."
            else
              echo "::error::Local and upstream histories have no common ancestor; resolve the Git history before syncing."
              exit 1
            fi
          fi

          # Prefer upstream on conflicts, then restore custom files from backup.
          git merge -X theirs --no-edit "upstream/${UPSTREAM_BRANCH}" || {
            echo "::error::Merge conflict occurred. Please resolve manually (or use GitHub Sync fork).";
            exit 1;
          }

          # Restore user-facing build customization. Core scripts under common/custom
          # must always come from upstream and are intentionally not restored.
          if [ -f "${BACKUP_FILE}" ]; then
            tar -xzf "${BACKUP_FILE}" -C . || true
            find build -type f -path '*/relevance/actions_version' -delete
            rm -f UPSTREAM_VERSION
            git add -A build 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "restore custom files after upstream sync"
            fi
          else
            find build -type f -path '*/relevance/actions_version' -delete
            rm -f UPSTREAM_VERSION
            git add -A build 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "remove obsolete version metadata after upstream sync"
            fi
          fi

          git push origin "${DEFAULT_BRANCH}"
