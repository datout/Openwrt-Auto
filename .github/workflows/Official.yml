#
# 使用本仓库内置 build 模板，不依赖外部 build-actions
#
# 因为SSH连接配置固件直接编译，会给github停止编译的,所以要另外触发启动编译程序
#
# 一般情况下都能触发启动编译的，除非没设置好密匙，或者密匙过期了，或者密匙错误之类的
#
# REPO_TOKEN密匙制作教程：https://git.io/jm.md
#
#

name: Official-官方
on:
  workflow_dispatch:
    inputs:
      REPO_BRANCH:
        description: '（官方源码）请选择源码分支'
        required: true
        default: 'openwrt-24.10'
        type: choice
        options:
          - 'openwrt-24.10'
          - 'openwrt-23.05'
          - 'master'
          - 'main'
      CONFIG_FILE:
        description: '请选择配置文件'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - 'armsr_rootfs_tar_gz'
          - 'phicomm_k3'
          - 'x86_64'
      INFORMATION_NOTICE:
        description: 'Telegram或pushplus信息通知'
        required: true
        default: '关闭'
        type: choice
        options:
          - '关闭'
          - 'Telegram'
          - 'Pushplus'
      KEEP_WORKFLOWS:
        description: '清理workflows,保留[X]个runs不被清理'
        required: true
        default: '30'
      KEEP_RELEASES:
        description: '清理Releases,保留[X]个Releases不被清理'
        required: true
        default: '30'
      SSH_ACTION:
        description: 'SSH远程配置固件'
        required: false
        default: 'false'
        type: boolean
      UPLOAD_FIRMWARE:
        description: '上传固件到 Github Artifacts'
        required: false
        default: 'true'
        type: boolean
      UPLOAD_RELEASE:
        description: '发布固件到 Github Releases'
        required: false
        default: 'false'
        type: boolean
      CACHEWRTBUILD_SWITCH:
        description: '缓存加速编译'
        required: false
        default: 'true'
        type: boolean
      UPDATE_FIRMWARE_ONLINE:
        description: '在线更新固/打包aarch64系列为img固件'
        required: false
        default: 'true'
        type: boolean


# 如若启动定时编译的话,配置文件是设置对应文件夹内的settings.ini文件
# 定时触发开启开始编译(把下面两个#去掉开启,时间设置请看定时开启编译说明)
#  schedule:
#   - cron: 35 18 * * *

concurrency:
  group: configure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_REPOSITORY: ${{github.repository}}
  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
  PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TZ: Asia/Shanghai
  DIY_WORK: workdir

jobs:
  build:
    name: 启动"${{ matrix.target }}-${{ github.event.inputs.REPO_BRANCH }}"触发编译
    runs-on: ubuntu-22.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    
    env:
      FOLDER_NAME: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [Official]
        
        # 请勿对 target: [Official] 做任何修改
        
    steps:
    - name: 检出自动化仓库
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}"
        git init -q
        git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${REPO_TOKEN}" | base64 -w0)"
        GIT_CONFIG_COUNT=1 \
        GIT_CONFIG_KEY_0=http.extraheader \
        GIT_CONFIG_VALUE_0="${AUTH_HEADER}" \
        git fetch -q --no-tags --prune origin "${GITHUB_REF_NAME}"
        git checkout --detach "${GITHUB_SHA}"
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        unset AUTH_HEADER

    - name: 统一源码构建入口
      env:
        BUILD_REPO_BRANCH: ${{ inputs.REPO_BRANCH }}
        BUILD_CONFIG_FILE: ${{ inputs.CONFIG_FILE }}
        BUILD_INFORMATION_NOTICE: ${{ inputs.INFORMATION_NOTICE }}
        BUILD_KEEP_WORKFLOWS: ${{ inputs.KEEP_WORKFLOWS }}
        BUILD_KEEP_RELEASES: ${{ inputs.KEEP_RELEASES }}
        BUILD_SSH_ACTION: ${{ inputs.SSH_ACTION }}
        BUILD_UPLOAD_FIRMWARE: ${{ inputs.UPLOAD_FIRMWARE }}
        BUILD_UPLOAD_RELEASE: ${{ inputs.UPLOAD_RELEASE }}
        BUILD_CACHEWRTBUILD_SWITCH: ${{ inputs.CACHEWRTBUILD_SWITCH }}
        BUILD_UPDATE_FIRMWARE_ONLINE: ${{ inputs.UPDATE_FIRMWARE_ONLINE }}
      shell: bash
      run: bash .github/scripts/build-entry.sh

    - name: SSH menuconfig
      if: env.SSH_ACTION == 'true'
      uses: datout/debugger-action@d0b87ac0f7002b14754dec9d7b92f3029e49a36c

    - name: 清理 SSH 调试进程
      if: always() && env.SSH_ACTION == 'true'
      shell: bash
      run: |
        sudo pkill -TERM -x tmate 2>/dev/null || true
        sleep 1
        sudo pkill -KILL -x tmate 2>/dev/null || true

    - name: 生成并校验最终 seed
      id: info
      uses: ./.github/actions/need

    - name: 上传配置快照
      if: steps.info.outputs.ready == 'true' && env.SHANG_CHUAN == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: .config_${{ env.SOURCE }}_${{ env.LUCI_EDITION }}_${{ env.TARGET_PROFILE }}_${{ env.CONFIG_DATE }}
        path: |
          ${{ env.CONFIG_TXT }}
          ${{ env.COMPILE_PATH }}/relevance/${{ env.CONFIG_FILE }}.full.config
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

    - name: 编译信息
      continue-on-error: true
      if: env.COMPILATION_INFORMATION == 'true'
      uses: ./.github/actions/message

    - name: 触发 ${{ matrix.target }}-${{ inputs.REPO_BRANCH }} 编译
      if: steps.info.outputs.ready == 'true'
      timeout-minutes: 5
      uses: ./.github/actions/trigger
